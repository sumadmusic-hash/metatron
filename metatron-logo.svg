<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#121b3b" />
      <stop offset="50%" stop-color="#0a0d1a" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Outer Nebula / Cloud Glow Filters / Gradients -->
    <radialGradient id="nebulaGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#172554" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Cube Gradients -->
    <!-- Top Face / Cap -->
    <linearGradient id="topFace" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>

    <!-- Left Main Pillar (Bright Cyan Blue) -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Right Main Pillar (Deep Blue to Purple) -->
    <linearGradient id="rightPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a86ff"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <!-- Inner Chevron / M-Vee Gradients -->
    <linearGradient id="leftChevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <linearGradient id="rightChevron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </linearGradient>

    <!-- Shadows and Highlights -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Atmospheric Nebula / Smoke Effect -->
  <circle cx="250" cy="225" r="180" fill="url(#nebulaGlow)" filter="url(#softGlow)"/>
  
  <!-- Outer Smoke Texture Blobs -->
  <g fill="#0b132b" opacity="0.5" filter="url(#softGlow)">
    <ellipse cx="160" cy="180" rx="90" ry="110" />
    <ellipse cx="340" cy="240" rx="100" ry="90" />
    <ellipse cx="250" cy="310" rx="120" ry="80" />
  </g>

  <!-- MAIN METATRON HEXAGONAL CUBE LOGO -->
  <g transform="translate(0, -10)">

    <!-- 1. TOP ROOF / CAP (Hexagonal Top Facet) -->
    <!-- Points: Center-Top (250, 75), Right-Top (355, 135), Center (250, 165), Left-Top (145, 135) -->
    <polygon points="250,75 355,135 250,165 145,135" fill="url(#topFace)" opacity="0.95"/>
    <!-- Top inner accent line for bevel / extrusion look -->
    <polygon points="250,90 335,135 250,158 165,135" fill="#caf0f8" opacity="0.3"/>

    <!-- 2. LEFT PILLAR (Outer Vertical Left Facet) -->
    <!-- Points: Left-Top (145, 135), Center (250, 165), Bottom-Left-Inner (250, 290), Left-Bottom (145, 230) -->
    <polygon points="145,135 250,165 250,290 145,230" fill="url(#leftPillar)"/>
    <!-- Left Pillar Inner Bevel Facet -->
    <polygon points="160,145 235,168 235,275 160,220" fill="#00f2fe" opacity="0.25"/>

    <!-- 3. RIGHT PILLAR (Outer Vertical Right Facet) -->
    <!-- Points: Right-Top (355, 135), Center (250, 165), Bottom-Right-Inner (250, 290), Right-Bottom (355, 230) -->
    <polygon points="355,135 250,165 250,290 355,230" fill="url(#rightPillar)"/>
    <!-- Right Pillar Inner Bevel Facet -->
    <polygon points="340,145 265,168 265,275 340,220" fill="#7209b7" opacity="0.35"/>

    <!-- 4. INNER M-CHEVRON (The M shape bridging downwards inside the hexagon) -->
    <!-- Left wing of M: from top center downward to middle valley -->
    <polygon points="250,165 195,225 250,290" fill="url(#leftChevron)" opacity="0.95"/>
    
    <!-- Right wing of M: from top center downward to middle valley -->
    <polygon points="250,165 305,225 250,290" fill="url(#rightChevron)" opacity="0.95"/>

    <!-- 5. LOWER INVERTED ROOF / BOTTOM PYRAMID FACET -->
    <!-- Points: Center (250, 290), Left-Bottom (145, 230), Bottom-Center (250, 345), Right-Bottom (355, 230) -->
    <polygon points="250,290 145,230 250,345 355,230" fill="url(#rightChevron)" opacity="0.85"/>
    
    <!-- Edge Highlights / Lighting FX for 3D Cyber Look -->
    <!-- Center Vertical Ridge Highlight -->
    <line x1="250" y1="75" x2="250" y2="165" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <line x1="250" y1="165" x2="250" y2="290" stroke="#00f2fe" stroke-width="2.5" opacity="0.6"/>

    <!-- Outer Rim Highlights -->
    <polyline points="145,135 145,230 250,345" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
    <polyline points="355,135 355,230 250,345" fill="none" stroke="#7209b7" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
    <polyline points="145,135 250,75 355,135" fill="none" stroke="#90e0ef" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>

  </g>
</svg>
