<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METATRON CHAIN DISCOVERY POC</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #161616;
        color: #f0f0f0;
      }
      #app {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      h2 {
        font-size: 14px;
        border-bottom: 1px solid #333;
        padding-bottom: 6px;
        margin-top: 24px;
      }
      h3 {
        font-size: 13px;
        margin-bottom: 4px;
        color: #9ad1ff;
      }
      input[type="text"] {
        margin-right: 8px;
        padding: 6px;
        border: 1px solid #444;
        border-radius: 4px;
        background: #222;
        color: #fff;
      }
      .btn {
        margin: 4px 8px 4px 0;
        padding: 6px 12px;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2a2a2a;
        color: #fff;
        cursor: pointer;
      }
      .btn:hover {
        background: #3a3a3a;
      }
      pre {
        background: #101010;
        border: 1px solid #2c2c2c;
        border-radius: 6px;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #d8d8d8;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 3px 0;
        font-size: 13px;
      }
      #error-area {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/poc/chain-discovery/main.ts"></script>
  </body>
</html>
